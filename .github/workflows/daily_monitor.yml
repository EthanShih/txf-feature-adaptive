name: Feature Adaptive Daily Monitor & GitHub Pages Deploy

on:
  schedule:
    # 台灣時間週一至週五 14:30 (UTC 06:30)
    - cron: '30 6 * * 1-5'
  workflow_dispatch: # 支援在 GitHub Actions 頁面手動一鍵觸發

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Monitor Pipeline
        run: |
          python run_daily.py

      - name: Commit Updated Historical Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Auto-update daily feature adaptive monitor data [$(date +'%Y-%m-%d')]"
            git push
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
